# see `man dnf.conf` for defaults and possible options

[main]
gpgcheck=True
installonly_limit=3
clean_requirements_on_remove=True
best=False
skip_if_unavailable=True
# Egne customizations under
defaultyes=True
max_parallel_downloads=20
fastestmirror=True
keepcache=False
# Må skru ned antall gamle kernels for å ha plass til custom kernel på /boot
installonly_limit=2
